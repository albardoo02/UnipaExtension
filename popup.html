<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>カスパ拡張</title>
  <style>
    body { width: 300px; margin: 0; padding: 12px 14px; font: 13px/1.5 system-ui, sans-serif; color: #1f2d3d; }
    h1 { margin: 0 0 10px; font-size: 14px; }
    label { display: flex; gap: 6px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
    .field { margin: 10px 0; }
    .field input { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-top: 4px; }
    .note { color: #5a6b7b; font-size: 12px; }
    #saved { color: #2f7d32; font-size: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <h1>カスパ拡張</h1>
  <label>
    <input type="checkbox" id="backReplace">
    <span>ブラウザの「戻る」をカスパの戻る操作に置き換える<br><span class="note">変更後はカスパのページを再読み込みしてください</span></span>
  </label>
  <div class="field">
    授業資料の保存フォルダ名
    <input type="text" id="rootFolder">
    <div class="note">ダウンロードフォルダ/〈この名前〉/授業名/資料名/ に保存します</div>
  </div>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
